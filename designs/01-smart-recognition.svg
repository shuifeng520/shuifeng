<svg width="1024" height="640" viewBox="0 0 1024 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>.page{fill:#f3f7fb}.card{fill:#fff;stroke:#d9e4f2}.selected{fill:#eef6ff;stroke:#8fc1ff;stroke-width:1.5}.muted{fill:#f7fafc;stroke:#e2e8f0}.blue{fill:#2b7bd8}.title{fill:#0f1f3a;font:700 24px Arial,"Microsoft YaHei",sans-serif}.h2{fill:#0f1f3a;font:700 18px Arial,"Microsoft YaHei",sans-serif}.h3{fill:#0f1f3a;font:700 15px Arial,"Microsoft YaHei",sans-serif}.body{fill:#5d6d85;font:400 13px Arial,"Microsoft YaHei",sans-serif}.small{fill:#718096;font:400 12px Arial,"Microsoft YaHei",sans-serif}.blueText{fill:#1f6fc6;font-weight:700}.white{fill:#fff;font:700 14px Arial,"Microsoft YaHei",sans-serif}</style>
  <rect class="page" width="1024" height="640"/><rect x="32" y="22" width="960" height="52" rx="12" class="blue"/><text x="56" y="55" class="white">部门预算执行审计智能体</text><text x="772" y="54" class="white" font-size="12">引导式访问 / 智能识别</text><text x="904" y="54" class="white" font-size="12">auditor</text>
  <text x="56" y="106" class="small">首页 / 智能识别</text><text x="56" y="136" class="title">智能识别工作流</text><text x="56" y="162" class="body">把三类资料汇总到一个向导中，系统持续展示抽取、补齐、入库和生成结果。</text>
  <line x1="95" y1="222" x2="929" y2="222" stroke="#2b7bd8" stroke-width="4"/><circle cx="95" cy="222" r="20" class="blue"/><text x="90" y="228" class="white">1</text><circle cx="373" cy="222" r="20" class="blue"/><text x="368" y="228" class="white">2</text><circle cx="651" cy="222" r="20" fill="#fff" stroke="#2b7bd8" stroke-width="3"/><text x="646" y="228" class="blueText">3</text><circle cx="929" cy="222" r="20" fill="#fff" stroke="#2b7bd8" stroke-width="3"/><text x="924" y="228" class="blueText">4</text><text x="63" y="262" class="h3">选择材料</text><text x="337" y="262" class="h3">上传/描述</text><text x="616" y="262" class="h3">抽取补齐</text><text x="894" y="262" class="h3">确认生成</text>
  <rect x="56" y="286" width="602" height="204" rx="16" class="card"/><text x="84" y="320" class="h2">1 选择已有材料</text><text x="84" y="344" class="body">资料类型放在同一行，支持单选或组合使用。</text><rect x="84" y="364" width="160" height="78" rx="12" class="selected"/><circle cx="108" cy="394" r="14" class="blue"/><text x="104" y="399" class="white" font-size="11">P</text><text x="132" y="390" class="h3">政策法规文件</text><text x="132" y="414" class="small">PDF / DOCX</text><text x="132" y="434" class="blueText" font-size="12">抽取审计规则</text><rect x="268" y="364" width="160" height="78" rx="12" class="muted"/><circle cx="292" cy="394" r="14" fill="#dbeafe"/><text x="288" y="399" fill="#64748b" font-weight="700" font-size="11">H</text><text x="316" y="390" class="h3">历史经验资料</text><text x="316" y="414" class="small">Excel / Word / CSV</text><text x="316" y="434" class="blueText" font-size="12">补齐同类案例</text><rect x="452" y="364" width="178" height="78" rx="12" class="muted"/><circle cx="476" cy="394" r="14" fill="#dbeafe"/><text x="471" y="399" fill="#64748b" font-weight="700" font-size="11">Q</text><text x="500" y="390" class="h3">直接描述问题</text><text x="500" y="414" class="small">自然语言输入</text><text x="500" y="434" class="blueText" font-size="12">识别审计方向</text><line x1="84" y1="462" x2="630" y2="462" stroke="#d9e4f2"/><text x="84" y="490" class="small">长标题示例：项目预算执行率偏低且合同支付异常疑点</text>
  <rect x="690" y="286" width="278" height="204" rx="16" class="card"/><text x="718" y="320" class="h2">3 抽取补齐预览</text><text x="718" y="344" class="body">右侧持续反馈结果，不再跳转。</text><rect x="718" y="366" width="95" height="28" rx="14" fill="#eef6ff" stroke="#8fc1ff"/><text x="740" y="385" class="blueText" font-size="12">政策规则</text><rect x="823" y="366" width="78" height="28" rx="14" fill="#f7fafc" stroke="#e2e8f0"/><text x="842" y="385" class="small">历史经验</text><rect x="718" y="410" width="222" height="58" rx="12" fill="#f8fbff" stroke="#d9e4f2"/><text x="736" y="434" class="h3">识别到 6 条审计关注点</text><text x="736" y="458" class="small">项目预算执行率偏低、采购合规性...</text>
  <rect x="176" y="568" width="276" height="34" rx="9" fill="#e8f2ff"/><text x="194" y="590" class="blueText" font-size="13">说明超过 2 行时进入详情抽屉。</text><rect x="650" y="568" width="118" height="34" rx="9" fill="#fff" stroke="#d9e4f2"/><text x="684" y="590" fill="#5d6d85" font-weight="700" font-size="13">上一步</text><rect x="788" y="568" width="180" height="34" rx="9" class="blue"/><text x="819" y="590" class="white">开始识别并生成</text>
</svg>
