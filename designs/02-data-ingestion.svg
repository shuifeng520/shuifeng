<svg width="1024" height="640" viewBox="0 0 1024 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>.page{fill:#f3f7fb}.card{fill:#fff;stroke:#d9e4f2}.selected{fill:#eef6ff;stroke:#8fc1ff;stroke-width:1.5}.muted{fill:#f7fafc;stroke:#e2e8f0}.field{fill:#f1f5f9}.blue{fill:#2b7bd8}.title{fill:#0f1f3a;font:700 24px Arial,"Microsoft YaHei",sans-serif}.h2{fill:#0f1f3a;font:700 18px Arial,"Microsoft YaHei",sans-serif}.h3{fill:#0f1f3a;font:700 15px Arial,"Microsoft YaHei",sans-serif}.body{fill:#5d6d85;font:400 13px Arial,"Microsoft YaHei",sans-serif}.small{fill:#718096;font:400 12px Arial,"Microsoft YaHei",sans-serif}.blueText{fill:#1f6fc6;font-weight:700}.greenText{fill:#15803d;font-weight:700}.orangeText{fill:#c2410c;font-weight:700}.white{fill:#fff;font:700 14px Arial,"Microsoft YaHei",sans-serif}</style>
  <rect class="page" width="1024" height="640"/><rect x="32" y="22" width="960" height="52" rx="12" class="blue"/><text x="56" y="55" class="white">部门预算执行审计智能体</text><text x="760" y="54" class="white" font-size="12">引导式访问 / 数据接入</text><text x="904" y="54" class="white" font-size="12">auditor</text>
  <text x="56" y="106" class="small">首页 / 数据接入</text><text x="56" y="136" class="title">审计数据接入工作流</text><text x="56" y="162" class="body">数据库直连和文件上传共用一个入口，预览清洗后再设为当前审计库。</text>
  <line x1="95" y1="222" x2="929" y2="222" stroke="#2b7bd8" stroke-width="4"/><circle cx="95" cy="222" r="20" class="blue"/><text x="90" y="228" class="white">1</text><circle cx="373" cy="222" r="20" class="blue"/><text x="368" y="228" class="white">2</text><circle cx="651" cy="222" r="20" fill="#fff" stroke="#2b7bd8" stroke-width="3"/><text x="646" y="228" class="blueText">3</text><circle cx="929" cy="222" r="20" fill="#fff" stroke="#2b7bd8" stroke-width="3"/><text x="924" y="228" class="blueText">4</text><text x="62" y="262" class="h3">选择方式</text><text x="337" y="262" class="h3">配置/上传</text><text x="616" y="262" class="h3">预览清洗</text><text x="894" y="262" class="h3">设为审计库</text>
  <rect x="56" y="286" width="602" height="204" rx="16" class="card"/><text x="84" y="320" class="h2">1 选择数据接入方式</text><text x="84" y="344" class="body">同一个向导内切换，避免在菜单中来回查找。</text><rect x="84" y="364" width="252" height="70" rx="12" class="selected"/><circle cx="112" cy="394" r="14" class="blue"/><text x="107" y="399" class="white" font-size="11">D</text><text x="140" y="390" class="h3">数据库直连</text><text x="140" y="414" class="small">MySQL / PostgreSQL / Oracle</text><text x="140" y="432" class="blueText" font-size="12">示例：localhost:3306 / dataset01</text><rect x="360" y="364" width="270" height="70" rx="12" class="muted"/><circle cx="388" cy="394" r="14" fill="#dbeafe"/><text x="384" y="399" fill="#64748b" font-weight="700" font-size="11">F</text><text x="416" y="390" class="h3">文件导入</text><text x="416" y="414" class="small">Excel / CSV 批量上传</text><text x="416" y="432" class="blueText" font-size="12">自动识别字段和数据表</text><text x="84" y="468" class="h3">2 填写连接信息或上传文件</text><rect x="84" y="480" width="130" height="28" rx="7" class="field"/><text x="98" y="557" class="small">localhost</text><rect x="228" y="480" width="92" height="28" rx="7" class="field"/><text x="250" y="557" class="small">3306</text><rect x="334" y="480" width="116" height="28" rx="7" class="field"/><text x="356" y="557" class="small">user1</text><rect x="464" y="480" width="166" height="28" rx="7" class="field"/><text x="506" y="557" class="small">******</text>
  <rect x="690" y="286" width="278" height="204" rx="16" class="card"/><text x="718" y="320" class="h2">3 预览清洗并入库</text><text x="718" y="344" class="body">系统先形成临时库，确认后入库。</text><rect x="718" y="366" width="80" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/><text x="739" y="385" class="greenText" font-size="12">已连接</text><rect x="810" y="366" width="86" height="28" rx="14" fill="#eef6ff" stroke="#8fc1ff"/><text x="831" y="385" class="blueText" font-size="12">表预览</text><rect x="718" y="408" width="222" height="58" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/><text x="736" y="432" class="h3">临时库：tmp_auditor</text><text x="736" y="456" class="small">识别 7 张表，共 5,830 行数据</text><rect x="718" y="478" width="222" height="42" rx="12" fill="#fff7ed" stroke="#fed7aa"/><text x="736" y="562" class="orangeText" font-size="12">发现 3 个字段需确认映射</text>
  <rect x="176" y="568" width="344" height="34" rx="9" fill="#e8f2ff"/><text x="194" y="590" class="blueText" font-size="13">直连和上传都先进入临时库，再确认入库。</text><rect x="650" y="568" width="118" height="34" rx="9" fill="#fff" stroke="#d9e4f2"/><text x="684" y="590" fill="#5d6d85" font-weight="700" font-size="13">上一步</text><rect x="788" y="568" width="180" height="34" rx="9" class="blue"/><text x="815" y="590" class="white">确认入库并分析</text>
</svg>
