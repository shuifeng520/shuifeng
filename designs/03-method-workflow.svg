<svg width="1024" height="640" viewBox="0 0 1024 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>.page{fill:#f3f7fb}.card{fill:#fff;stroke:#d9e4f2}.selected{fill:#2b7bd8}.muted{fill:#f7fafc;stroke:#e2e8f0}.code{fill:#f8fbff;stroke:#d9e4f2}.blue{fill:#2b7bd8}.title{fill:#0f1f3a;font:700 24px Arial,"Microsoft YaHei",sans-serif}.h2{fill:#0f1f3a;font:700 18px Arial,"Microsoft YaHei",sans-serif}.h3{fill:#0f1f3a;font:700 15px Arial,"Microsoft YaHei",sans-serif}.body{fill:#5d6d85;font:400 13px Arial,"Microsoft YaHei",sans-serif}.small{fill:#718096;font:400 12px Arial,"Microsoft YaHei",sans-serif}.blueText{fill:#1f6fc6;font-weight:700}.white{fill:#fff;font:700 14px Arial,"Microsoft YaHei",sans-serif}.mono{fill:#334155;font:500 12px Consolas,monospace}</style>
  <rect class="page" width="1024" height="640"/><rect x="32" y="22" width="960" height="52" rx="12" class="blue"/><text x="56" y="55" class="white">部门预算执行审计智能体</text><text x="724" y="54" class="white" font-size="12">引导式访问 / 方法全流程</text><text x="904" y="54" class="white" font-size="12">auditor</text>
  <text x="56" y="106" class="small">首页 / 方法执行</text><text x="56" y="136" class="title">审计方法全流程工作流</text><text x="56" y="162" class="body">思路、SQL、验证和导出保持在一个任务流程内，用户可回到任一步继续编辑。</text>
  <line x1="95" y1="222" x2="929" y2="222" stroke="#2b7bd8" stroke-width="4"/><circle cx="95" cy="222" r="20" class="blue"/><text x="90" y="228" class="white">1</text><circle cx="373" cy="222" r="20" class="blue"/><text x="368" y="228" class="white">2</text><circle cx="651" cy="222" r="20" class="blue"/><text x="646" y="228" class="white">3</text><circle cx="929" cy="222" r="20" fill="#fff" stroke="#2b7bd8" stroke-width="3"/><text x="924" y="228" class="blueText">4</text><text x="63" y="262" class="h3">选择思路</text><text x="337" y="262" class="h3">生成 SQL</text><text x="616" y="262" class="h3">执行验证</text><text x="894" y="262" class="h3">导出归档</text>
  <rect x="56" y="286" width="246" height="204" rx="16" class="card"/><text x="84" y="320" class="h2">1 选择审计思路</text><rect x="84" y="340" width="82" height="28" rx="7" class="muted"/><text x="113" y="359" class="small">全部</text><rect x="176" y="340" width="98" height="28" rx="7" class="muted"/><text x="199" y="359" class="small">搜索关键词</text><text x="84" y="392" class="small">共 26 条</text><rect x="84" y="408" width="190" height="34" rx="8" class="selected"/><text x="104" y="430" class="white" font-size="12">4-1-1 电梯维护费超标...</text><text x="84" y="466" class="body">资金支出合规性</text><text x="84" y="488" class="small">标题 1 行省略，悬浮显示完整内容</text>
  <rect x="326" y="286" width="356" height="204" rx="16" class="card"/><text x="354" y="320" class="h2">2 查看详情并编辑 SQL</text><text x="354" y="346" class="h3">4-1-1：电梯维护费单价超标审计</text><text x="354" y="368" class="body">规则分类：资金支出合规性</text><rect x="354" y="386" width="278" height="45" rx="10" fill="#eef6ff" stroke="#8fc1ff"/><text x="372" y="407" class="blueText" font-size="12">分析思路：提取合同与支付明细，</text><text x="372" y="424" class="blueText" font-size="12">计算单价并与标准限额比对。</text><rect x="354" y="448" width="278" height="92" rx="10" class="code"/><text x="372" y="470" class="mono">SELECT 项目名称, 支付摘要, 支付金额</text><text x="372" y="490" class="mono">FROM 年度支付明细表</text><text x="372" y="568" class="mono">WHERE 支付摘要 LIKE '%电梯维护%'</text><text x="372" y="588" class="mono">AND 单价 &gt; 8800;</text>
  <rect x="706" y="286" width="262" height="204" rx="16" class="card"/><text x="734" y="320" class="h2">3 执行验证并导出</text><text x="734" y="344" class="body">同页运行 SQL，预览命中结果。</text><rect x="734" y="366" width="190" height="38" rx="10" class="blue"/><text x="785" y="390" class="white">运行当前 SQL</text><rect x="734" y="422" width="190" height="50" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/><text x="752" y="444" class="h3">执行完成 · 命中 15 条</text><text x="752" y="464" class="small">耗时 1.8s · dataset01</text><rect x="734" y="486" width="90" height="34" rx="9" fill="#fff" stroke="#d9e4f2"/><text x="755" y="566" class="blueText" font-size="12">导出 Excel</text><rect x="834" y="486" width="90" height="34" rx="9" fill="#fff" stroke="#d9e4f2"/><text x="855" y="566" class="blueText" font-size="12">打包报告</text>
  <rect x="176" y="568" width="326" height="34" rx="9" fill="#e8f2ff"/><text x="194" y="590" class="blueText" font-size="13">思路、SQL、执行结果可回溯关联。</text><rect x="650" y="568" width="118" height="34" rx="9" fill="#fff" stroke="#d9e4f2"/><text x="684" y="590" fill="#5d6d85" font-weight="700" font-size="13">上一步</text><rect x="788" y="568" width="180" height="34" rx="9" class="blue"/><text x="818" y="590" class="white">保存并归档结果</text>
</svg>
